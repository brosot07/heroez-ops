# Heroez Ops — business rules. All thresholds live here.
# Times are WIB (Asia/Jakarta). "business minutes" only count inside business hours.

mode: shadow            # shadow = compute + log alerts, send nothing. live = send to Telegram.

timezone: Asia/Jakarta

business_hours:
  # 0 = Monday ... 6 = Sunday. Days listed here run the reminder timers.
  days: [0, 1, 2, 3, 4, 5, 6]
  start: "09:30"
  end: "21:00"
  holidays_file: config/holidays.yaml

whatsapp:
  # The Heroez number, digits only with country code (e.g. 6281234567890).
  business_number: "6280000000000"
  window_hours: 24

admins:
  # telegram_id: numeric Telegram user ID. Each person sends /start to the Heroez bot,
  # and their ID then appears on the settings page.
  # supervisors: who gets this admin's escalations. Empty = all supervisors.
  - key: admin1
    name: Admin 1
    telegram_id: 0
    supervisors: [spv1]
  - key: admin2
    name: Admin 2
    telegram_id: 0
    supervisors: [spv1]

supervisors:
  - key: spv1
    name: Supervisor 1
    telegram_id: 0

on_call_rotation: [admin1, admin2]   # rotates daily, used outside business hours

telegram:
  mode: polling             # polling = no public address needed for Telegram (recommended)
  admin_group_id: 0         # optional group chat for team alerts (0 = off)
  management_group_id: 0    # optional group chat for management alerts (0 = off)
  management_user_ids: []   # extra Telegram user IDs allowed to use the bot

escalation:
  nudge_assignee_after_business_min: 30
  alert_group_after_business_min: 120
  alert_management_p1_after_business_min: 240
  urgent_after_real_hours: 18      # since client's last message, real time
  overdue_after_real_hours: 24     # since client's last message, real time
  snooze_minutes: 60
  repeat_every_business_min: 60    # keep reminding the assignee every hour until replied (0 = off)

alerts:
  min_minutes_between_messages_per_recipient: 60   # at most 1 Telegram message per person per hour
  max_items_per_message: 5

weekend:
  days: [5, 6]                       # Saturday, Sunday
  min_minutes_between_messages_per_recipient: 360   # at most 1 notification per person per 6 hours

digest:
  admin_morning_time: "09:30"       # each admin: their waiting chats
  management_time: "09:30"          # supervisors + management group: yesterday's numbers

talent_roster_file: data/talent_roster.csv   # columns: name,phone,handler (admin key)

ai:
  # Claude checks each client message: question / inquiry / closure? Needs a Claude API key
  # (settings page). Without a key the text rules alone decide.
  enabled: true
  model: claude-haiku-5-5
  min_confidence_to_close: 0.75   # AI must be this sure before it closes a chat (no alert)
  context_messages: 8             # how many recent messages the AI reads
  wait_minutes: 10                # alerts wait this long for the AI check; then rules decide

retention:
  message_text_days: 90   # message texts are erased after this many days (UU PDP); states and metrics stay
  raw_webhook_days: 7     # raw webhook payloads (contain message text) are deleted after this
  backup_keep: 14         # daily database backups kept in data/backups

possibly_replied:
  # How long a POSSIBLY_REPLIED chat stays quiet before the digest lists it again.
  recheck_hours: 24
