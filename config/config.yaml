# Heroez Ops — business rules. All thresholds live here.
# Times are WIB (Asia/Jakarta). "business minutes" only count inside business hours.

mode: shadow            # shadow = compute + log alerts, send nothing. live = send to Telegram.

timezone: Asia/Jakarta

business_hours:
  # 0 = Monday ... 6 = Sunday
  days: [0, 1, 2, 3, 4, 5]
  start: "09:00"
  end: "21:00"
  holidays_file: config/holidays.yaml

whatsapp:
  # The Heroez number, digits only with country code (e.g. 6281234567890).
  business_number: "6280000000000"
  window_hours: 24

admins:
  # telegram_id: numeric Telegram user ID (send /start to @userinfobot to find it).
  - key: admin1
    name: Admin 1
    telegram_id: 0
  - key: admin2
    name: Admin 2
    telegram_id: 0

supervisor: admin1          # admin key that also receives 2h alerts
on_call_rotation: [admin1, admin2]   # rotates daily, used outside business hours

telegram:
  admin_group_id: 0         # group chat ID for team alerts
  management_group_id: 0    # group chat ID for management alerts / digests
  management_user_ids: []   # extra Telegram user IDs allowed to use the bot

escalation:
  nudge_assignee_after_business_min: 30
  alert_group_after_business_min: 120
  alert_management_p1_after_business_min: 240
  urgent_after_real_hours: 18      # since client's last message, real time
  overdue_after_real_hours: 24     # since client's last message, real time
  snooze_minutes: 60

alerts:
  min_minutes_between_messages_per_recipient: 10
  max_items_per_message: 5

digest:
  admin_morning_time: "08:30"

talent_roster_file: data/talent_roster.csv   # columns: name,phone,handler (admin key)

possibly_replied:
  # How long a POSSIBLY_REPLIED chat stays quiet before the digest lists it again.
  recheck_hours: 24
