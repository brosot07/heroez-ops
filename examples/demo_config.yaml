# Demo config for the replay tool (fake Telegram IDs).
mode: shadow
timezone: Asia/Jakarta
business_hours:
  days:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  start: 09:00
  end: '21:00'
  holidays_file: config/holidays.yaml
whatsapp:
  business_number: '6280000000000'
