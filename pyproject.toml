[project]
name = "heroez-ops"
version = "0.1.0"
description = "Listen-only WhatsApp inbox monitor that reminds Heroez admins about unreplied chats via Telegram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heroez-replay = "heroez_ops.replay:main"

[tool.setuptools.packages.find]
include = ["heroez_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
