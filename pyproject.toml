[project]
name = "heroez-ops"
version = "0.6.0"
description = "Listen-only WhatsApp inbox monitor that reminds Heroez admins about unreplied chats via Telegram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "tzdata",            # Windows has no system time-zone database
    "anthropic>=2.3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "openpyxl>=3.1",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heroez-replay = "heroez_ops.replay:main"
heroez-ops = "heroez_ops.winmain:main"

[tool.setuptools.package-data]
heroez_ops = ["defaults/*.yaml", "prompts/*.md"]

[tool.setuptools.packages.find]
include = ["heroez_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
