# Builds HeroezOps-Setup-<version>.exe on a Windows runner.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.8.0.
# The installer appears under the run's "Artifacts" (and on the Release for tags).
#
# Supply chain: every download is pinned to a version and checked against a SHA256
# recorded here; actions are pinned to exact versions; the token is read-only except
# for the release step.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.8.0)"
        required: true
        default: "0.8.0"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  WINSW_VERSION: v2.12.0
  WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da
  CLOUDFLARED_VERSION: "2026.10.5"
  CLOUDFLARED_SHA256: db4e4c413612a0916f3e1679d3caaf376f94911952d163028fb726fb2e0516a9
  INNOSETUP_VERSION: "6.4.3"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r packaging/windows/requirements-build.txt pytest==8.4.1
      - name: Tests
        shell: pwsh
        run: |
          python -m pytest -q -rf 2>&1 | Tee-Object -FilePath pytest.txt
          if ($LASTEXITCODE -ne 0) {
            # Surface the failures as annotations (readable through the API when the raw log is not).
            $lines = Get-Content pytest.txt
            $sel = @($lines | Where-Object { $_ -match '^(FAILED|ERROR) ' } | Select-Object -First 8)
            $sel += @($lines | Where-Object { $_ -match '^E ' } | Select-Object -First 2)
            foreach ($l in $sel) { Write-Output "::error::$l" }
            exit 1
          }

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: Version
        id: v
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME.TrimStart("v") } else { $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version must look like 1.2.3, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build HeroezOps.exe
        run: |
          pip install -r packaging/windows/requirements-build.txt
          pyinstaller --noconfirm packaging/windows/HeroezOps.spec

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $env:HEROEZ_HOME = "$env:RUNNER_TEMP\hzhome"
          $p = Start-Process dist\HeroezOps\HeroezOps.exe -PassThru -WindowStyle Hidden
          Start-Sleep 10
          $r = Invoke-WebRequest http://127.0.0.1:8788/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "settings page did not start" }
          $h = Invoke-WebRequest http://127.0.0.1:8787/health -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw "service did not start" }
          Stop-Process $p.Id

      - name: Download WinSW and cloudflared (pinned, checksummed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/windows/bin | Out-Null
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe" -OutFile packaging/windows/bin/WinSW-x64.exe
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/download/$env:CLOUDFLARED_VERSION/cloudflared-windows-amd64.exe" -OutFile packaging/windows/bin/cloudflared.exe
          foreach ($pair in @(@("packaging/windows/bin/WinSW-x64.exe", $env:WINSW_SHA256), @("packaging/windows/bin/cloudflared.exe", $env:CLOUDFLARED_SHA256))) {
            $actual = (Get-FileHash $pair[0] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $pair[1]) { throw "checksum mismatch for $($pair[0]): $actual" }
          }
          $sig = Get-AuthenticodeSignature packaging/windows/bin/cloudflared.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Cloudflare") { throw "cloudflared signature check failed: $($sig.Status)" }
          & packaging/windows/bin/cloudflared.exe --version

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNOSETUP_VERSION --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: HeroezOps-Setup-${{ steps.v.outputs.version }}
          path: dist/installer/*.exe

  release:
    # A tag push or a manual run with a version number publishes a GitHub Release
    # (the manual run creates the tag v<version> at the built commit).
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
      - uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Heroez Ops ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: dist/**/*.exe
