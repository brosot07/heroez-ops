# One-command deploy on the server:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../config:/app/config:ro      # edit config on the server, then: docker compose restart app
      - ../data:/app/data             # SQLite DB + shadow log; keep this on the encrypted volume
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
