# Heroez Ops web app. From the repository folder on the server:
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm app heroez-ops init     (once)
#   docker compose -f deploy/docker-compose.yml up -d
# Every key (Meta, Telegram, Claude, ...) is then entered on the settings page; there is no .env file.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: heroez-ops:latest
    restart: unless-stopped
    volumes:
      - heroez_data:/data            # config, database, encrypted secrets, documents, daily backups
    # No "ports:": the app is reached only through the Cloudflare Tunnel started inside the container.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  heroez_data:
